# A fresh Windows machine for every published release: see tools/clean-install-test.ps1.
# Holds no secrets and downloads everything anonymously, as a new user would.
name: clean-install
on:
  workflow_run:
    workflows: [publish]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-machine:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install, update online, use through MCP, uninstall
        shell: pwsh
        env:
          FEED_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: ./tools/clean-install-test.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
